# Publish a week of predicted GPS and Galileo orbit data to the ephemeris-data branch:
#   https://raw.githubusercontent.com/badriram/open-extended-ephemeris/ephemeris-data/gps-7d.rnx
#   .../gps-7d-ubx.bin   .../gps-7d-casic.bin   .../gps-7d.json   .../fit-state.txt
# Four times a day, and by hand, each run with CODE's newest 5-day orbit prediction (IGS
# ultra-rapid as the fallback) and the newest broadcasts. A run takes under a minute.
name: publish
on:
  schedule:
    - cron: "30 4,10,16,22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - name: Start from the previous run's fits, if there is one
        run: curl -sfL -o warm.txt "https://raw.githubusercontent.com/${{ github.repository }}/ephemeris-data/fit-state.txt" || rm -f warm.txt
      - name: Predict seven days
        run: ./target/release/extended-ephemeris --out out $( [ -f warm.txt ] && echo --warm warm.txt )
      - name: Publish to ephemeris-data
        run: |
          cd out
          cp ../LICENSE .
          printf '%s\n' \
            '# Predicted GPS and Galileo orbit data (extended ephemeris)' '' \
            'A week of GPS and Galileo broadcast-style ephemerides predicted from the newest CODE 5-day orbit by' \
            'https://github.com/badriram/open-extended-ephemeris. These are predictions, not the' \
            "satellites' own broadcasts. gps-7d.rnx is RINEX 3.04; gps-7d-ubx.bin is u-blox UBX-MGA-GPS-EPH" \
            'and UBX-MGA-GAL-EPH frames (M8/M9/M10); gps-7d-casic.bin is GPS-only CASIC MSG-GPSEPH frames for AT6558 receivers (Quectel' \
            'L76K). "extended-ephemeris select" picks the frames for now. gps-7d.json says when and from what it was made,' \
            "with a self-check against the satellites' broadcasts. This branch holds only the latest." '' \
            'Orbits: Center for Orbit Determination in Europe (CODE), University of Bern, DOI 10.48620/97774;' \
            'International GNSS Service (IGS), via BKG. Broadcast clocks: IGS, via BKG. MIT licence (see LICENSE).' > README.md
          git init -q -b ephemeris-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Predicted GPS and Galileo orbit data, $(jq -r .prediction_starts gps-7d.json)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ephemeris-data
